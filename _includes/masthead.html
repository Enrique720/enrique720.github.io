{% include base_path %}

<div class="masthead sticky top-0 z-50 border-b border-slate-700/40 bg-void/86 backdrop-blur-xl">
  <div class="masthead__inner-wrap mx-auto flex w-[min(1180px,calc(100%_-_32px))] items-center justify-between gap-4 py-4">
    <a href="{{ base_path }}/" class="site-lockup group flex items-center gap-3 no-underline">
      <span class="leading-tight">
        <span class="site-lockup__name block text-sm font-semibold uppercase tracking-[.18em] text-slate-100">{{ site.title }}</span>
        <span class="site-lockup__tagline block font-mono text-xs text-slate-400 group-hover:text-voltage">security research / systems / ctf</span>
      </span>
    </a>

    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav flex items-center justify-end">
        <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="masthead-links"><span class="navicon"></span></button>
        <ul id="masthead-links" class="visible-links m-0 flex list-none flex-wrap items-center gap-1 p-0">
          <li class="masthead__menu-item masthead__menu-item--lg persist hidden"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a class="rounded border border-transparent px-3 py-2 font-mono text-xs uppercase tracking-[.16em] text-slate-300 no-underline transition hover:border-phosphor/30 hover:bg-phosphor/10 hover:text-phosphor" href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden rounded border border-slate-700/60 bg-slate-950/95 p-2 shadow-terminal"></ul>
      </nav>
    </div>
  </div>
</div>
